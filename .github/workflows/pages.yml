name: Pages

# The prototype has no build step, so the branch *is* the artifact.
# Everything in the app already loads via relative paths, which is what makes
# deploying to a project page subdirectory (/#/lad-jokes/) work unmodified.
# Deployed to https://lin4cre.github.io/lad-jokes/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Static checks (fails the deploy on a dangling asset reference)
        run: node tools/check.mjs

      - name: Assemble the file set
        run: |
          mkdir -p _site
          cp index.html app.js sw.js app.webmanifest icon.svg LICENSE README.md _site/
          cp -r styles lib data views icons assets _site/
          find _site -type f | sort

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
